name: Release App

# Al crear una etiqueta app-vX.Y.Z, compila los instaladores de Windows y Linux
# y los adjunta a un borrador de Release para revisarlo antes de publicarlo.
# Las etiquetas vX.Y.Z (sin "app-") siguen siendo del script de bash.
on:
  push:
    tags: ["app-v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Dependencias de sistema (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libssl-dev pkg-config

      - uses: pnpm/action-setup@v4
        with:
          version: latest
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri -> target

      - run: pnpm install --frozen-lockfile
        working-directory: app

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Firma de las actualizaciones (la app solo acepta actualizaciones firmadas con esta clave)
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: app
          tagName: ${{ github.ref_name }}
          releaseName: "the-wired ${{ github.ref_name }}"
          releaseBody: |
            App de escritorio de the-wired para Windows y Linux.

            **Windows:** `the-wired_*_x64-setup.exe` (recomendado) o `.msi`.
            **Linux:** `.AppImage` (cualquier distro), `.deb` (Debian/Ubuntu) o `.rpm` (Fedora/openSUSE).

            La primera vez la app descarga yt-dlp (y ffmpeg en Windows) desde sus repositorios oficiales.
            El script de terminal se sigue instalando con `git clone` + `./install.sh`.
          # Borrador: se revisa antes de publicarlo. Al publicarlo pasa a ser la "latest"
          # y las apps instaladas encuentran la actualización en latest.json.
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: true
