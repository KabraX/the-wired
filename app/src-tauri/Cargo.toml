[package]
name = "the-wired"
version = "1.0.0"
description = "the-wired: buscador y descargador de anime en español para bibliotecas de Jellyfin"
authors = ["KabraX"]
license = "MIT"
repository = "https://github.com/KabraX/the-wired"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "the_wired_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
scraper = "0.29.0"
regex = "1.13.1"
base64 = "0.23.1"
thiserror = "2.0.21"
url = "2.5.8"
reqwest = { version = "0.13.5", default-features = false, features = ["native-tls", "cookies", "json", "form", "stream"] }
tokio = { version = "1.54.1", features = ["time", "process", "io-util", "sync", "macros", "rt"] }
tauri-plugin-dialog = "2.8.3"
zip = { version = "9.1.1", default-features = false, features = ["deflate"] }
futures-util = "0.3.34"
tauri-plugin-process = "2"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[dev-dependencies]
tauri = { version = "2", features = ["test"] }
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread"] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"
